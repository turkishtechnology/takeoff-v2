name: Feature Request
description: Suggest a new component, prop, token, or improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >
        ### Thanks for the suggestion! Before opening a new issue, please search
        existing issues to avoid duplicates.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: What do you want, and why? What problem does it solve?
      placeholder: "I need this because..."
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Affected surface
      description: Which package or component would this touch?
      placeholder: e.g. @takeoff-ui/react-spar (Select), @takeoff-design/tokens, @takeoff-design/tailwind
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or APIs you've looked at.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Screenshots, Figma links, Spar parity notes, etc.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this issue, you agree to follow our [Contributing Guidelines](https://github.com/turkishtechnology/takeoff-v2/blob/develop/CONTRIBUTING.md).
      options:
        - label: I've searched the documentation
          required: true
        - label: I've searched for existing issues
          required: true
