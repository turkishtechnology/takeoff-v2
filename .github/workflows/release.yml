name: Release

# Stable-only release loop owned by Changesets:
#
# On every push to `develop`, the Changesets action looks at .changeset/.
# - If pending changesets exist, it opens (or updates) a single "Version
#   Packages" PR. Stable publish is gated behind merging that PR.
# - If no pending changesets exist (i.e., a Version Packages PR was just
#   merged), it publishes the bumped packages to npm under the `latest`
#   dist-tag.
#
# Snapshot publishing under the `next` dist-tag was intentionally removed
# after a config issue caused `changeset version --snapshot` to bump real
# stable versions (0.1.1 instead of 0.1.1-next-<sha>), which blocked the
# subsequent stable publish because the version "was already published."
# Re-introduce snapshot publishing once we've validated a correct
# prereleaseTemplate config in a sandbox.
#
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Configure each package at https://www.npmjs.com/package/<name>/settings as a
# trusted publisher for this repo + workflow before merging.

on:
  push:
    branches: [develop]

# Avoid two concurrent releases (e.g. rapid merges to develop) racing the npm
# registry or each other on the Version Packages PR.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # contents:    let the Changesets action commit Version Packages updates
    # pull-requests: open/update the Version Packages PR
    # id-token:    npm OIDC for trusted publishing + provenance attestations
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Pinned via .nvmrc (currently 24). Node 24 ships with npm 11.x which
          # supports OIDC trusted publishing natively; CI uses the same .nvmrc so
          # a green CI can't hide a publish-time Node mismatch. We still run an
          # explicit npm upgrade below as a safety floor in case the bundled npm
          # minor doesn't meet 11.5.1.
          #
          # NOTE: if you lower .nvmrc below 24, restore an explicit node-version
          # here — OIDC trusted publishing needs npm >= 11.5.1.
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI floor for OIDC trusted publishing
        # --force bypasses the "Cannot find module 'promise-retry'" bug that
        # can surface when the bundled npm tries to update itself from a
        # half-resolved global tree.
        run: npm install -g npm@latest --force

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Either opens the Version Packages PR or publishes when that PR merges.
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
