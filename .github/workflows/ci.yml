name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Pure validation boundaries: no codegen, no package builds ─────────
      - name: Validate types (pure tsc --noEmit)
        run: pnpm turbo check-types

      - name: Validate lint (pure eslint)
        run: pnpm turbo lint

      - name: Validate Spar prop Pick<> discipline
        run: pnpm --filter @takeoff-ui/react-spar lint:spar-pick

      - name: Validate markdown link integrity
        uses: lycheeverse/lychee-action@v2
        with:
          # No --base: with it, lychee resolves relative links against the base
          # instead of the file's own location, producing bogus paths like
          # `<workspace>/../../../docs/foo.md`. Without --base, relative links
          # like `../foo.md` resolve correctly against the markdown file.
          #
          # Excludes:
          # - `^file:///docs/` — Docusaurus root-relative links (e.g.
          #   `/docs/installation`) that only resolve in the Docusaurus runtime,
          #   not in the filesystem
          # - `spar\.app\.turkishtechlab\.com` — external host that times out
          #   intermittently from the CI runner
          args: |
            --no-progress
            --exclude-path node_modules
            --exclude '^file:///docs/'
            --exclude 'spar\.app\.turkishtechlab\.com'
            './**/*.md'
            './**/*.mdx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: pnpm turbo test

      # ── Build runs codegen + package + site as preparation steps ──────────
      - name: Build (packages + docs site)
        run: pnpm turbo build
