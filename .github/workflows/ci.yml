name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Pure validation boundaries: no codegen, no package builds ─────────
      - name: Validate types (pure tsc --noEmit)
        run: pnpm turbo check-types

      - name: Validate lint (pure eslint)
        run: pnpm turbo lint

      - name: Validate markdown link integrity
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --base . --exclude-path node_modules './**/*.md' './**/*.mdx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: pnpm turbo test

      # ── Build runs codegen + package + site as preparation steps ──────────
      - name: Build (packages + docs site)
        run: pnpm turbo build
