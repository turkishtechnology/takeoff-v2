name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Single source of truth for Node — matches the release workflow so a
          # green CI can't hide a publish-time Node mismatch.
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # spar and react-spar must load the same React. Two copies in the lockfile
      # (even two patch versions) make every spar hook throw "Invalid hook call"
      # in react-spar's tests. Fail here instead, with the fix in the message.
      - name: Validate the lockfile is deduped (run `pnpm dedupe` to fix)
        run: pnpm dedupe --check

      # react-spar resolves @turkish-technology/spar through the workspace, and
      # its types, tests and the docs API tables read spar's built dist. Build
      # that one package first; everything after this stays pure validation.
      - name: Build spar (react-spar reads its dist)
        run: pnpm turbo build --filter=@turkish-technology/spar

      # ── Pure validation boundaries: no codegen, no other package builds ───
      - name: Validate types (pure tsc --noEmit)
        run: pnpm turbo check-types

      - name: Validate lint (pure eslint)
        run: pnpm turbo lint

      - name: Validate Spar prop Pick<> discipline
        run: pnpm --filter @takeoff-ui/react-spar lint:spar-pick

      # Every shipped component needs a `takeoff-<name>` usage skill, and the
      # `takeoff-ui` component map must route to it — otherwise the skill is
      # authored but unreachable, and agents hand-roll markup instead.
      - name: Validate agent skill coverage
        run: pnpm lint:skills

      # A prop added to types.ts has to reach the skill too — the skills feed
      # llms.txt, AGENTS.md, and the Copilot instructions, so a stale one
      # misinforms every assistant, not just Claude Code.
      - name: Validate skills document every prop
        run: pnpm lint:skill-props

      # The Copilot instructions and the consumer AGENTS.md template are
      # generated from the same skills; regenerate and fail if that produces a
      # diff, so the non-Claude assistants never drift from the skill content.
      - name: Validate agent instructions are in sync
        run: pnpm gen:agent-instructions:check

      # Regenerates the docs API tables from the component `types.ts` and fails
      # if that produces a diff — i.e. someone changed a type without re-running
      # `gen:api`, leaving the published API reference stale. Pure codegen +
      # `git diff`, no package build needed (reads source via the TS compiler).
      - name: Validate docs API tables are in sync
        run: pnpm --filter docs gen:api:check

      # The Takeoff Icons changelog is generated from the published packages
      # (it needs the network, so it is committed). Fail when the docs install a
      # newer @takeoff-icons version than the changelog covers.
      - name: Validate the icons changelog covers the installed version
        run: pnpm --filter docs gen:icons-changelog:check

      - name: Validate markdown link integrity
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative links (e.g.
          # `/docs/installation`) for filtering before they fail the URL
          # builder. The exclude pattern then skips them entirely — they
          # are Docusaurus runtime links and don't map to filesystem paths.
          #
          # Crucially, NO --base — that would force lychee to resolve every
          # `../foo.md` relative link against the base instead of the file's
          # own location, producing bogus absolute paths.
          #
          # Excludes:
          # - `/docs/` — Docusaurus root-relative links that only resolve in
          #   the Docusaurus runtime, not in the filesystem
          # - `spar\.app\.turkishtechlab\.com` — external host that times out
          #   intermittently from the CI runner
          # - `npmjs\.com` — answers CI runners with 403 (bot protection), so a
          #   valid package link fails; spar's README badges point there
          args: |
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude-path node_modules
            --exclude '/docs/'
            --exclude 'spar\.app\.turkishtechlab\.com'
            --exclude 'npmjs\.com'
            './**/*.md'
            './**/*.mdx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Unit tests are pure too: react-spar tests read source directly, and the
      # tokens build-tokens test runs its own build in beforeAll — neither needs
      # `turbo build` first. react-spar runs with coverage so the thresholds in
      # its vitest.config.ts fail the job when coverage regresses.
      - name: Unit tests (react-spar, with coverage thresholds)
        run: pnpm --filter @takeoff-ui/react-spar test:coverage

      - name: Unit tests (spar)
        run: pnpm --filter @turkish-technology/spar test

      - name: Unit tests (tokens)
        run: pnpm --filter @takeoff-design/tokens test

      # Synthesizes the docs hosting stack (no AWS access) and checks the
      # CloudFront rewrite rule and the deploy role's trust policy.
      - name: Unit tests (infra)
        run: pnpm --filter infra test

      # ── Build runs codegen + package + site as preparation steps ──────────
      - name: Build (packages + docs site)
        run: pnpm turbo build
