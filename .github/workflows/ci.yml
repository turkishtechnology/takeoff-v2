name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # Single source of truth for Node — matches the release workflow so a
          # green CI can't hide a publish-time Node mismatch.
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Pure validation boundaries: no codegen, no package builds ─────────
      - name: Validate types (pure tsc --noEmit)
        run: pnpm turbo check-types

      - name: Validate lint (pure eslint)
        run: pnpm turbo lint

      - name: Validate Spar prop Pick<> discipline
        run: pnpm --filter @takeoff-ui/react-spar lint:spar-pick

      - name: Validate markdown link integrity
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative links (e.g.
          # `/docs/installation`) for filtering before they fail the URL
          # builder. The exclude pattern then skips them entirely — they
          # are Docusaurus runtime links and don't map to filesystem paths.
          #
          # Crucially, NO --base — that would force lychee to resolve every
          # `../foo.md` relative link against the base instead of the file's
          # own location, producing bogus absolute paths.
          #
          # Excludes:
          # - `/docs/` — Docusaurus root-relative links that only resolve in
          #   the Docusaurus runtime, not in the filesystem
          # - `spar\.app\.turkishtechlab\.com` — external host that times out
          #   intermittently from the CI runner
          args: |
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude-path node_modules
            --exclude '/docs/'
            --exclude 'spar\.app\.turkishtechlab\.com'
            './**/*.md'
            './**/*.mdx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Unit tests intentionally omitted — react-spar has no test files yet
      # (vitest config exists but no *.test.* sources). Re-add this step the
      # first time a real test lands.

      # ── Build runs codegen + package + site as preparation steps ──────────
      - name: Build (packages + docs site)
        run: pnpm turbo build
