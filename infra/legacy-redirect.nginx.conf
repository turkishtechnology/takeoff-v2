# Old docs hosts, still served by Dokploy, now only redirect to the AWS site
# (https://v2.takeoffui.com). Built by the root Dockerfile.
#
# Dokploy's proxy terminates TLS and keeps the Host header, so the server
# blocks below can tell the two hosts apart.

# Takeoff Spar docs: same paths on the new host.
server {
    listen 3002 default_server;
    server_name takeoff-v2.app.turkishtechlab.com _;
    return 301 https://v2.takeoffui.com$request_uri;
}

# Standalone Spar site: its pages moved under /headless (Takeoff Headless).
server {
    listen 3002;
    server_name spar.app.turkishtechlab.com;
    return 301 https://v2.takeoffui.com/headless$request_uri;
}
