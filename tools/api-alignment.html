<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button API Alignment</title>
    <link rel="stylesheet" href="./api-alignment.css" />
  </head>
  <body>
    <header>
      <div>
        <h1 id="pageTitle">Button API Alignment</h1>
        <p id="pageSubtitle">takeoff-ui + spar are the source layers; react-spar cells are intentionally blank because Button will be ported from scratch.</p>
      </div>
      <div class="actions">
        <button id="btnExport" class="primary">Export markdown</button>
        <button id="btnReset">Reset decisions</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot keep"></span> Keep (accept current name)</div>
      <div class="legend-item"><span class="legend-dot rename"></span> Rename (type new name)</div>
      <div class="legend-item"><span class="legend-dot drop"></span> Drop from this layer</div>
      <div class="legend-item"><span class="legend-dot add"></span> Add (for rows missing in the layer)</div>
      <div class="legend-item"><span class="legend-dot skip"></span> Skip (no decision / N/A)</div>
    </div>

    <main id="main"></main>

    <aside id="exportPanel" class="export-panel">
      <div class="dialog">
        <header>
          <h2>Exported markdown</h2>
        </header>
        <textarea id="exportText" readonly></textarea>
        <div class="dialog-footer">
          <button id="btnCopy" class="primary">Copy to clipboard</button>
          <button id="btnClose">Close</button>
        </div>
      </div>
    </aside>

    <div class="toast" id="toast"></div>

    <script>
      window.API_ALIGNMENT_CONFIG = {
        title: 'Button API Alignment',
        subtitle: 'takeoff-ui + spar are the source layers; react-spar cells are intentionally blank because Button will be ported from scratch.',
        storageKey: 'buttonApiAlignmentDecisions.v2',
        exportTitle: '# Button API - scratch-port worksheet',
        exportNote:
          'Generated from tools/api-alignment.template.html. For this worksheet, react-spar cells are intentionally blank so the final surface can be decided interactively.',
        data: {
          parts: [
            {
              id: 'root',
              label: 'Button (root)',
              description: 'State and behavior owned by the root regardless of the eventual react-spar anatomy.',
              props: [
                {
                  id: 'visualType',
                  concept: 'Visual style family',
                  takeoffUi: {
                    name: 'type',
                    type: "'filled' | 'filledLight' | 'outlined' | 'text'",
                    default: "'filled'",
                    note: 'takeoff-ui source + API docs both include `filledLight`.',
                  },
                  spar: null,
                  reactSpar: null,
                  note: "Spar's native `type` prop controls submit/reset semantics, so it is not the same concept as takeoff-ui visual `type`.",
                },
                {
                  id: 'variant',
                  concept: 'Semantic color variant',
                  takeoffUi: {
                    name: 'variant',
                    type: "'primary' | 'secondary' | 'neutral' | 'info' | 'success' | 'danger' | 'warning' | 'white' | 'black'",
                    default: "'primary'",
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'size',
                  concept: 'Component size',
                  takeoffUi: {
                    name: 'size',
                    type: "'large' | 'base' | 'small'",
                    default: "'base'",
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'behaviorMode',
                  concept: 'Behavior mode (button / submit / reset / link)',
                  takeoffUi: {
                    name: 'mode',
                    type: "'button' | 'submit' | 'reset' | 'link'",
                    default: "'button'",
                  },
                  spar: {
                    name: 'as / type',
                    type: 'ElementType + native button `type`',
                    default: "`as='button'`, `type='button'`",
                    note: 'Spar has no dedicated `link` mode; submit/reset use native button semantics.',
                  },
                  reactSpar: null,
                },
                {
                  id: 'polymorphicTag',
                  concept: 'Rendered element selection',
                  takeoffUi: {
                    name: '(internal)',
                    type: '`<button>` or `<a>` based on `mode`',
                    default: '—',
                  },
                  spar: {
                    name: 'as',
                    type: 'ElementType',
                    default: "'button'",
                  },
                  reactSpar: null,
                },
                {
                  id: 'href',
                  concept: 'Link destination',
                  takeoffUi: {
                    name: 'href',
                    type: 'string',
                    default: 'null',
                  },
                  spar: {
                    name: 'href',
                    type: 'native anchor attribute',
                    default: 'undefined',
                    note: 'Available when `as="a"`.',
                  },
                  reactSpar: null,
                },
                {
                  id: 'target',
                  concept: 'Link target',
                  takeoffUi: {
                    name: 'target',
                    type: 'string',
                    default: 'null',
                  },
                  spar: {
                    name: 'target',
                    type: 'native anchor attribute',
                    default: 'undefined',
                    note: 'Available when `as="a"`.',
                  },
                  reactSpar: null,
                },
                {
                  id: 'rel',
                  concept: 'Link relationship',
                  takeoffUi: null,
                  spar: {
                    name: 'rel',
                    type: 'native anchor attribute',
                    default: 'undefined',
                    note: 'Available when `as="a"`.',
                  },
                  reactSpar: null,
                },
                {
                  id: 'loading',
                  concept: 'Loading state',
                  takeoffUi: {
                    name: 'loading',
                    type: 'boolean',
                    default: 'null',
                    note: 'Injects an internal `tk-spinner` and suppresses icon rendering.',
                  },
                  spar: {
                    name: 'isLoading',
                    type: 'boolean',
                    default: 'false',
                    note: 'Announces busy state but does not provide a dedicated visual slot.',
                  },
                  reactSpar: null,
                },
                {
                  id: 'disabled',
                  concept: 'Disabled state',
                  takeoffUi: {
                    name: 'disabled',
                    type: 'boolean',
                    default: 'null',
                  },
                  spar: {
                    name: 'disabled',
                    type: 'boolean',
                    default: 'false',
                  },
                  reactSpar: null,
                },
                {
                  id: 'fullWidth',
                  concept: 'Stretch to container width',
                  takeoffUi: {
                    name: 'fullWidth',
                    type: 'boolean',
                    default: 'null',
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'underline',
                  concept: 'Underline label',
                  takeoffUi: {
                    name: 'underline',
                    type: 'boolean',
                    default: 'null',
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'iconOnly',
                  concept: 'Explicit icon-only intent',
                  takeoffUi: {
                    name: '(implicit)',
                    type: 'derived from empty `label` + `icon`',
                    default: '—',
                    note: 'takeoff-ui does not expose an explicit `iconOnly` prop.',
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'rounded',
                  concept: 'Circular icon-only shape',
                  takeoffUi: {
                    name: 'rounded',
                    type: 'boolean',
                    default: 'null',
                    note: 'Only takes effect when runtime content is icon-only.',
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'activation',
                  concept: 'Activation callback / event',
                  takeoffUi: {
                    name: 'tk-click',
                    type: 'CustomEvent<MouseEvent>',
                    default: '—',
                  },
                  spar: {
                    name: 'onClick',
                    type: '(event) => void',
                    default: 'undefined',
                  },
                  reactSpar: null,
                },
                {
                  id: 'pressedState',
                  concept: 'Toggle pressed state',
                  takeoffUi: null,
                  spar: {
                    name: 'isPressed / onPressedChange',
                    type: 'boolean / (pressed: boolean) => void',
                    default: 'undefined',
                    note: 'Spar exposes toggle-button semantics on the same primitive.',
                  },
                  reactSpar: null,
                },
              ],
            },
            {
              id: 'content',
              label: 'Content Mapping',
              description: 'Source-side content and visual ownership. Use the empty react-spar cells to decide whether these become root props, parts, or are dropped.',
              props: [
                {
                  id: 'labelText',
                  concept: 'Label text content',
                  takeoffUi: {
                    name: 'label',
                    type: 'string',
                    default: "''",
                  },
                  spar: {
                    name: 'children',
                    type: 'ReactNode',
                    default: 'undefined',
                    note: 'Leaf child content; no dedicated label slot.',
                  },
                  reactSpar: null,
                },
                {
                  id: 'iconPayload',
                  concept: 'Icon payload',
                  takeoffUi: {
                    name: 'icon',
                    type: 'string | IIconOptions | IMultiIconOptions',
                    default: 'null',
                  },
                  spar: {
                    name: 'children',
                    type: 'ReactNode',
                    default: 'undefined',
                    note: 'Leaf child content; no dedicated icon slot.',
                  },
                  reactSpar: null,
                  note: '`IMultiIconOptions` means takeoff-ui can express more than one icon through the same root prop.',
                },
                {
                  id: 'iconSide',
                  concept: 'Left vs right icon placement',
                  takeoffUi: {
                    name: 'iconPosition',
                    type: "'left' | 'right'",
                    default: "'left'",
                  },
                  spar: null,
                  reactSpar: null,
                },
                {
                  id: 'loadingVisual',
                  concept: 'Visible loading indicator content',
                  takeoffUi: {
                    name: 'loading',
                    type: 'boolean',
                    default: 'null',
                    note: 'Visual spinner is internal and not independently customizable.',
                  },
                  spar: {
                    name: 'isLoading',
                    type: 'boolean',
                    default: 'false',
                    note: 'Busy semantics only; no dedicated spinner slot.',
                  },
                  reactSpar: null,
                },
              ],
            },
          ],
        },
      };
    </script>
    <script src="./api-alignment.runtime.js"></script>
  </body>
</html>
